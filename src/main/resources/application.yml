spring:
  datasource:
    url: ${organizations_db_url}
    username: ${organizations_db_username}
    password: ${organizations_db_password}
  jpa:
    hibernate:
      # The table is created outside the app (see db/). Hibernate only checks that it matches the entity.
      ddl-auto: validate
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${base-oauth-url}
          jwk-set-uri: ${base-oauth-url}/protocol/openid-connect/certs
server:
  port: 80
base-oauth-url: ${KEYCLOAK_AUTH_URL}
organization-api-client-id: ORGANIZATIONS-API
