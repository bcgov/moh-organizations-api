# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kcd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Create the database role, schema and table
      env:
        PGHOST: localhost
        PGDATABASE: kcd
      run: |
        PGPASSWORD=postgres psql -U postgres -v ON_ERROR_STOP=1 -v password=organizations_api -f db/create-role-and-schema.sql
        PGPASSWORD=organizations_api psql -U organizations_api -v ON_ERROR_STOP=1 -f db/create-organization-table.sql
    - name: Build with Maven
      env: 
        ORGANIZATIONS_API_TOKEN_CREDENTIALS: ${{ secrets.ORGANIZATIONS_API_TOKEN_CREDENTIALS }}
        ORGANIZATIONS_API_TOKEN_URL: "https://common-logon-dev.hlth.gov.bc.ca/auth/realms/moh_applications/protocol/openid-connect/token"
        KEYCLOAK_AUTH_URL: ${{ secrets.KEYCLOAK_AUTH_URL }}
      run: mvn -B package --file pom.xml
